services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./Gestor-Inteligente-de-Documentos
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_TIMEOUT_MS=${GEMINI_TIMEOUT_MS:-45000}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-minimal}
      - IA_MOBILE_MAX_TOKENS=${IA_MOBILE_MAX_TOKENS:-768}
      - QUEUE_ENABLED=${QUEUE_ENABLED}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: node dist/index.js
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend-worker:
    build:
      context: ./Gestor-Inteligente-de-Documentos
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_TIMEOUT_MS=${GEMINI_TIMEOUT_MS:-45000}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-minimal}
      - IA_MOBILE_MAX_TOKENS=${IA_MOBILE_MAX_TOKENS:-768}
      - QUEUE_ENABLED=${QUEUE_ENABLED}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: node dist/workers/document.worker.js

  frontend:
    build:
      context: ./Gestor-Inteligente-de-Documentos-Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: herramientastic-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  redis_data:
