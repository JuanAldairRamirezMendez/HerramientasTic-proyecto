name: CI

on:
  push:
    branches:
      - master
      - main
      - develop

  pull_request:
    branches:
      - master
      - main
      - develop

  workflow_dispatch:

# Cancela ejecuciones viejas de la misma rama.
concurrency:
  group: ci-root-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: '1'
  COMPOSE_DOCKER_CLI_BUILD: '1'

jobs:
  # Comprueba que los gitlinks apunten a commits publicados en ramas estables.
  submodules:
    name: submodules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código con submódulos
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verificar commits de submódulos
        run: bash scripts/verify-submodules.sh --env any

  # Valida los scripts antes de usarlos en el pipeline de integración.
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Validar sintaxis Bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Instalar ShellCheck si falta
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Ejecutar ShellCheck
        run: shellcheck scripts/*.sh

  # Levanta el stack real (API + worker + Redis + frontend) y hace smoke.
  integration:
    name: integration
    runs-on: ubuntu-latest
    needs:
      - submodules
      - scripts
    timeout-minutes: 40

    steps:
      - name: Descargar código con submódulos
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Generar .env ficticio para CI
        run: bash scripts/write-ci-env.sh

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar servicios
        run: docker compose up -d --wait --wait-timeout 300 redis backend-api backend-worker frontend

      - name: Smoke test
        env:
          BACKEND_URL: http://localhost:3000
          FRONTEND_URL: http://localhost
        run: bash scripts/smoke.sh

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Detener servicios
        if: always()
        run: docker compose down -v --remove-orphans

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          # Historial completo: Gitleaks escanea también los commits nuevos.
          fetch-depth: 0

      # Escaneo de secretos. Es gratuito en repositorios de usuario.
      - name: Escaneo de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
